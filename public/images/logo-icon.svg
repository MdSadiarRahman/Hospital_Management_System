<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
    <defs>
        <linearGradient id="hmsLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0aa4b5" />
            <stop offset="60%" stop-color="#087F8C" />
            <stop offset="100%" stop-color="#123B5D" />
        </linearGradient>
        <linearGradient id="hmsPulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
            <stop offset="50%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#5eead4" />
        </linearGradient>
        <filter id="hmsGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#087F8C" flood-opacity="0.28" />
        </filter>
    </defs>
    <!-- Base Rounded Squircle with Shadow -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#hmsLogoGrad)" filter="url(#hmsGlow)" />
    <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="rgba(255,255,255,0.28)" stroke-width="1" />
    
    <!-- Stylized Medical Cross (Subtle background layer) -->
    <rect x="20.5" y="10" width="7" height="28" rx="3.5" fill="#ffffff" fill-opacity="0.22" />
    <rect x="10" y="20.5" width="28" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.22" />
    
    <!-- Solid Pure White Cross Core -->
    <path d="M 21.5 12 C 21.5 10.9 22.4 10 23.5 10 L 24.5 10 C 25.6 10 26.5 10.9 26.5 12 L 26.5 21.5 L 36 21.5 C 37.1 21.5 38 22.4 38 23.5 L 38 24.5 C 38 25.6 37.1 26.5 36 26.5 L 26.5 26.5 L 26.5 36 C 26.5 37.1 25.6 38 24.5 38 L 23.5 38 C 22.4 38 21.5 37.1 21.5 36 L 21.5 26.5 L 12 26.5 C 10.9 26.5 10 25.6 10 24.5 L 10 23.5 C 10 22.4 10.9 21.5 12 21.5 L 21.5 21.5 Z" fill="#ffffff" />
    
    <!-- Dynamic Healthcare ECG Rhythm Wave (Pulse Line) -->
    <path d="M 10 24 L 17 24 L 20 18 L 23 29 L 26 15 L 29 27 L 31 22 L 33 24 L 38 24" stroke="url(#hmsPulseGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Subtle Vitality Dot -->
    <circle cx="34" cy="15" r="2.2" fill="#5eead4" />
</svg>
